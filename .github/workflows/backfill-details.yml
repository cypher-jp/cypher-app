# 過去イベントの詳細情報(審査員/DJ/エントリー費など)をAIで一括バックフィルするワークフロー。
# 手動実行: GitHub → Actions → "Backfill event details" → Run workflow
# 必要な Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY (scrape.yml と共通)
name: Backfill event details

on:
  schedule:
    - cron: "30 21 * * *" # UTC 21:30 = JST 6:30 (朝のスクレイプ直後に新規イベントの詳細を埋める)
  workflow_dispatch:
    inputs:
      limit:
        description: "1回で処理する最大件数 (既定60)"
        required: false
        default: "60"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backfill
        run: npx tsx scripts/backfill-details.ts ${{ github.event.inputs.limit }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
