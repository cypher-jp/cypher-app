# Instagram Reels 動画を Remotion でレンダリングして Supabase Storage(reels) に保存するワークフロー。
# 起動方法:
#   - 管理画面 /admin/reels の「Generate Reel」→ repository_dispatch (event_type: render-reel)
#   - 30分おきの定期実行(取りこぼし回収。queued が無ければ数秒で終了)
#   - 手動: GitHub → Actions → "Render Instagram Reel" → Run workflow
#
# 必要な Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (scrape.yml と共通)
name: Render Instagram Reel

on:
  repository_dispatch:
    types: [render-reel]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "reel_jobs.id (空なら queued を古い順に処理)"
        required: false
        default: ""

concurrency:
  group: render-reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install CJK fonts (日本語・中国語・韓国語の会場名など用)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null

      - name: Install dependencies
        working-directory: remotion
        run: npm ci

      - name: Ensure Chrome Headless Shell
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Render queued reels
        working-directory: remotion
        run: npx tsx scripts/render.ts ${{ github.event.inputs.job_id || github.event.client_payload.job_id || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: https://worldcypher.net
